<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!--
  ═══ 一支 MV 的装配页（三种画风共用）═════════════════════════════════════
  这个文件只管"装"：加载画风引擎、角色、歌词、镜头，然后逐帧渲染。
  改 MV 时只动两处：① 下面 CFG 那一块  ② 中间 <script src="shots/.."> 的行。
  引擎/装配逻辑在 assemble.js，本文件不需要动。
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101014; }
  canvas { display: block; }
</style>

<!-- ① 画风引擎（三选一，从 templates/<风格>/ 拷过来，文件名保持 engine.js） -->
<script defer src="engine.js"></script>
<!-- ② 角色（所有镜头共用同一份，角色才不会漂移） -->
<script defer src="character.js"></script>
<!-- ③ 歌词时间轴（scripts/srt2js.py 生成，没歌词就不放这行） -->
<script defer src="lyrics.js"></script>

<script>
// ═══════════════════════ ④ CFG：开工时只改这一段 ═══════════════════════
window.CFG = {
  W: 1920, H: 1080,          // 竖屏改 1080 × 1920（引擎按 W/H 比例重排）
  FPS: 30,
  DURATION: 6.0,             // 成片总长（秒）= 最后一个镜头的 end
  BPM: 120, OFF: 0.0,        // scripts/analyze_song.py 测出来的 BPM 和第一拍（秒）
  LYRIC: { bottom: 0.90, size: 68, color: '#FFF8E7', ink: '#1B1B29', align: 'center' },
  SAFE_BOTTOM: 0.15,         // 画面下方这一条留给歌词：角色的脚、重要东西别放进来
  DEBUG: /[?&]debug=1/.test(location.search),
};
window.SHOTS = [];           // 镜头注册表：shots/*.js 往里 push
// ═════════════════════════════════════════════════════════════════════
</script>

<!-- ⑤ 镜头：每个镜头一个文件，按时间顺序列（顺序错会互相盖住） -->
<!-- 每个镜头一个文件，按 start 顺序列在这里（新加镜头记得加一行，删了也要删行） -->
<script defer src="shots/01.js"></script>

<!-- ⑥ 装配 + 逐帧渲染（不用动）。defer 必须留：没有它 assemble.js 会在 <body> 之前跑，报 appendChild of null -->
<script defer src="assemble.js"></script>
</head>
<body>
<canvas id="c"></canvas>
</body>
</html>
