-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101014; }
  canvas { display: block; }
</style>

<script src="../engine.js"></script>

<script>
window.CFG = { W: 320, H: 180, OUT: { w: 1920, h: 1080 }, FPS: 30, DURATION: 6.0, BPM: 120, OFF: 0.0,
  LYRIC: { bottom: 0.90, size: 68, color: '#FFF6DC', ink: '#15121C', align: 'center' }, SAFE_BOTTOM: 0.15,
  DEBUG: /[?&]debug=1/.test(location.search) };
window.SHOTS = [];
</script>

<script src="shots/01.js"></script>
<script src="shots/02.js"></script>

<script src="../../_shared/assemble.js" defer></script>
</head>

</body>
</html>
